    <style>
      #loading-skeleton {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        font-family: 'Orbitron', sans-serif;
        transition: opacity 0.3s ease;
      }
      #loading-skeleton .brand {
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #000000;
        margin-bottom: 24px;
      }
      #loading-skeleton .loader-bar {
        width: 160px;
        height: 3px;
        background: #e5e7eb;
        border-radius: 4px;
        overflow: hidden;
      }
      #loading-skeleton .loader-bar-inner {
        width: 40%;
        height: 100%;
        background: #e10600;
        border-radius: 4px;
        animation: splash-loader 1.4s ease-in-out infinite;
      }
      @keyframes splash-loader {
        0% {
          transform: translateX(0);
          width: 20%;
        }
        50% {
          width: 60%;
          transform: translateX(100px);
        }
        100% {
          transform: translateX(280px);
          width: 20%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading-skeleton .loader-bar-inner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading-skeleton">
      <div class="brand" dir="ltr">S.E.A</div>
      <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>
